name: .NET Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore RaceDay2.sln

    - name: Build the solution
      run: dotnet build RaceDay2.sln --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test RaceDay2.sln --no-build --configuration Release --verbosity normal
